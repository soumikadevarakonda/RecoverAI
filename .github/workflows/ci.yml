name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]   # README promises 3.11+; older Pythons evaluate annotations eagerly
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: recoverai
          POSTGRES_PASSWORD: recoverai
          POSTGRES_DB: recoverai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U recoverai"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: backend
      DATABASE_URL: postgresql+psycopg://recoverai:recoverai@localhost:5432/recoverai_test
      TEST_DATABASE_URL: postgresql+psycopg://recoverai:recoverai@localhost:5432/recoverai_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Tests
        run: python -m pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: index.html is generated from views/
        run: python gen_spa.py --check
      - run: npm ci
      - name: Built stylesheet is up to date
        run: |
          npm run build:css
          git diff --exit-code -- css/tailwind.css
      - name: Inline scripts parse
        run: |
          node --check js/api.js
          python - <<'PY'
          import re, subprocess, tempfile, pathlib
          for page in ("index.html", "pay.html"):
              html = pathlib.Path(page).read_text(encoding="utf-8")
              for i, block in enumerate(b for b in re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.S) if b.strip()):
                  with tempfile.NamedTemporaryFile("w", suffix=".js", delete=False, encoding="utf-8") as f:
                      f.write(block)
                  subprocess.run(["node", "--check", f.name], check=True)
          PY
