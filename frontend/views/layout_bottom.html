    </main>

    <!-- Minimal Footer -->
    <footer class="bg-bg-carbon border-t border-border-hairline py-6 px-8 mt-12">
        <div class="max-w-[1600px] mx-auto flex flex-col md:flex-row justify-between items-center gap-4 text-text-muted text-[12px] font-mono">
            <div>RecoverAI &bull; Merchant Revenue Recovery Control Plane</div>
            <div>Detection &bull; Decisioning &bull; Recovery &bull; Verification</div>
        </div>
    </footer>

    <script>
        // ------------------------------------------------------------------
        // Application State
        //
        // Every figure shown comes from the backend. Recovered revenue is only
        // ever what the backend has verified (signed webhook or the dev
        // checkout simulator, which settles through the same verification
        // path). Nothing is recorded as recovered in the browser.
        // ------------------------------------------------------------------
        const AppState = {
            summary: null,
            incidents: [],
            activeIncident: null,
            recoveries: [],
            activeRecoveryId: null,   // operator's selection; stays stable across refreshes
            auditEvents: [],
            apiAvailable: false
        };

        const PLACEHOLDER = '—';

        // Elements whose design-time sample values must never be shown as live data.
        const LIVE_FIELD_IDS = [
            'cmd-incident-id-display', 'cmd-revenue-at-risk', 'cmd-failed-payments', 'cmd-subtitle',
            'cmd-cohort-channel', 'cmd-cohort-step', 'cmd-curr-failure-rate', 'cmd-baseline-failure-rate',
            'cmd-rate-delta', 'cmd-diagnosis-title', 'cmd-diagnosis-explanation', 'cmd-evidence-bank',
            'cmd-evidence-method', 'cmd-evidence-code', 'cmd-evidence-step', 'cmd-action-name',
            'cmd-hist-rate', 'cmd-hist-attempts', 'cmd-expected-recovery', 'cmd-guardrail-note',
            'inc-confidence-badge', 'inc-bank-method', 'inc-error-code', 'inc-error-step', 'inc-failure-jump',
            'inc-diag-explanation', 'inc-base-total', 'inc-base-failed', 'inc-base-rate', 'inc-base-vol',
            'inc-curr-total', 'inc-curr-failed', 'inc-curr-rate', 'inc-curr-vol',
            'dec-action-hero', 'dec-recovery-id', 'dec-attempt-status', 'dec-revenue-at-risk-label',
            'dec-expected-net', 'dec-hist-attempts', 'dec-hist-rate', 'dec-hist-calibration',
            'dec-incentive-cost', 'dec-rationale', 'cmd-rate-note', 'cmd-expected-note', 'inc-diag-heading',
            'camp-table-count', 'camp-target-count', 'camp-target-volume', 'camp-recovered-volume', 'camp-status-badge',
            'header-merchant-name'
        ];

        function clearLiveFields() {
            LIVE_FIELD_IDS.forEach(id => setText(id, PLACEHOLDER));
        }

        // --- Safe DOM helpers ---

        function escapeHtml(value) {
            if (value === undefined || value === null) return '';
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function setText(id, value) {
            const el = document.getElementById(id);
            if (el) el.textContent = (value === undefined || value === null || value === '') ? PLACEHOLDER : value;
        }

        // Only http(s) URLs and the same-origin checkout simulator may be linked.
        function safePaymentUrl(shortUrl) {
            if (!shortUrl || typeof shortUrl !== 'string') return null;
            if (shortUrl.startsWith('/pay.html')) return shortUrl;
            try {
                const parsed = new URL(shortUrl);
                return (parsed.protocol === 'https:' || parsed.protocol === 'http:') ? parsed.href : null;
            } catch (e) {
                return null;
            }
        }

        // --- Formatting (amounts are integer paise from the API) ---

        function formatINR(paise) {
            if (paise === undefined || paise === null || isNaN(Number(paise))) return PLACEHOLDER;
            const rupees = Number(paise) / 100;
            return '₹' + rupees.toLocaleString('en-IN', { maximumFractionDigits: 2 });
        }

        function formatPercent(val) {
            if (val === undefined || val === null || isNaN(Number(val))) return PLACEHOLDER;
            return (Number(val) * 100).toFixed(1) + '%';
        }

        function titleCase(text) {
            if (!text) return PLACEHOLDER;
            return text.charAt(0).toUpperCase() + text.slice(1);
        }

        // --- Derived data ---

        function incidentRecoveries() {
            const inc = AppState.activeIncident;
            const all = AppState.recoveries || [];
            return inc ? all.filter(r => r.incident_id === inc.id) : [];
        }

        function getActiveRecovery() {
            const all = AppState.recoveries || [];
            if (AppState.activeRecoveryId) {
                const selected = all.find(r => r.recovery_id === AppState.activeRecoveryId);
                if (selected) return selected;
            }
            // Default selection: first actionable attempt of the active incident.
            const scoped = incidentRecoveries();
            const pick = scoped.find(r => r.status === 'pending' || r.status === 'approved')
                || scoped.find(r => r.status === 'executed')
                || scoped[0]
                || null;
            AppState.activeRecoveryId = pick ? pick.recovery_id : null;
            return pick;
        }

        function selectRecovery(recoveryId) {
            AppState.activeRecoveryId = recoveryId;
            renderAll();
            refreshAuditTrail();
        }

        function campaignTotals() {
            const recs = incidentRecoveries();
            const targetVolume = recs.reduce((acc, r) => acc + (r.payment_amount || 0), 0);
            const recovered = recs.filter(r => r.status === 'recovered');
            const recoveredVolume = recovered.reduce((acc, r) => acc + (r.recovered_amount || 0), 0);
            return {
                recs,
                targetCount: recs.length,
                targetVolume,
                recoveredCount: recovered.length,
                recoveredVolume,
            };
        }

        // --- Navigation ---

        function navigate(viewId) {
            const views = ['command', 'incidents', 'decision', 'campaign', 'trace'];
            views.forEach(v => {
                const el = document.getElementById('view-' + v);
                const nav = document.getElementById('nav-' + v);
                if (el) el.classList.add('hidden');
                if (nav) {
                    nav.classList.remove('tab-active');
                    nav.classList.add('tab-inactive');
                }
            });

            const activeView = document.getElementById('view-' + viewId);
            const activeNav = document.getElementById('nav-' + viewId);
            if (activeView) activeView.classList.remove('hidden');
            if (activeNav) {
                activeNav.classList.remove('tab-inactive');
                activeNav.classList.add('tab-active');
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });

            if (viewId === 'campaign' || viewId === 'decision') {
                refreshRecoveries();
            } else if (viewId === 'trace') {
                refreshAuditTrail();
            }
        }

        // --- View Renderers ---

        function renderAll() {
            renderCommandCenter();
            renderIncidentDetail();
            renderDecisionRoom();
            renderCampaign();
        }

        function renderCommandCenter() {
            const inc = AppState.activeIncident;
            const rec = getActiveRecovery();
            const totals = campaignTotals();

            if (!inc) {
                setText('cmd-status-label', AppState.apiAvailable ? 'No Active Degradation' : 'Telemetry Unavailable');
                return;
            }

            const riskBase = inc.revenue_at_risk;
            const outstanding = Math.max(0, riskBase - totals.recoveredVolume);
            const targetCount = totals.targetCount || inc.current_failed_count;
            const remaining = Math.max(0, targetCount - totals.recoveredCount);

            setText('cmd-revenue-at-risk', formatINR(outstanding));

            const elFailed = document.getElementById('cmd-failed-payments');
            if (elFailed) {
                let html = `Consequence: <span class="text-white font-medium">${escapeHtml(remaining)} failed payments${totals.recoveredCount ? ' remaining' : ''}</span> &rarr; <span class="text-accent-coral font-medium">${escapeHtml(formatINR(outstanding))} at risk</span>`;
                if (totals.recoveredCount) {
                    html += ` &bull; <span class="text-accent-green font-medium">${escapeHtml(formatINR(totals.recoveredVolume))} verified recovered</span>`;
                }
                elFailed.innerHTML = html;
            }

            const channel = `${inc.bank || 'UNKNOWN'} · ${(inc.method || 'UNKNOWN').toUpperCase()}`;
            const elSubtitle = document.getElementById('cmd-subtitle');
            if (elSubtitle) {
                elSubtitle.innerHTML = `Failure spike detected in <span class="text-white font-medium">${escapeHtml(channel)}</span> traffic. ${escapeHtml(inc.current_failed_count)} customer checkouts failed in the detection window.`;
            }

            setText('cmd-status-label', inc.status === 'resolved' ? 'Incident Resolved' : 'Active Degradation Detected');
            setText('cmd-incident-id-display', 'ID: ' + String(inc.id).substring(0, 8));
            setText('cmd-cohort-channel', channel);
            setText('cmd-cohort-step', inc.error_step === 'payment_authorization'
                ? 'Authorization-step degradation in payment gateway integration'
                : inc.error_step);
            setText('cmd-curr-failure-rate', formatPercent(inc.current_failure_rate));
            setText('cmd-baseline-failure-rate', `vs ${formatPercent(inc.baseline_failure_rate)} baseline`);
            setText('cmd-rate-delta', inc.absolute_rate_increase === undefined || inc.absolute_rate_increase === null
                ? PLACEHOLDER
                : `+${(inc.absolute_rate_increase * 100).toFixed(1)}% pts`);
            setText('cmd-rate-note', inc.relative_degradation === undefined || inc.relative_degradation === null
                ? null
                : `${Number(inc.relative_degradation).toFixed(1)}x elevation above baseline failure rate`);
            setText('cmd-evidence-bank', inc.bank ? inc.bank + ' Bank' : null);
            setText('cmd-evidence-method', inc.method ? inc.method.toUpperCase() : null);
            setText('cmd-evidence-code', inc.error_code);
            setText('cmd-evidence-step', inc.error_step);

            if (inc.diagnosis) {
                setText('cmd-diagnosis-title', titleCase(inc.diagnosis.diagnosis_type));
                setText('cmd-diagnosis-explanation', inc.diagnosis.explanation);
            }

            const evidence = (rec && rec.decision_evidence) || {};
            setText('cmd-action-name', rec ? titleCase(rec.selected_action) : null);
            setText('cmd-hist-rate', formatPercent(evidence.expected_recovery_rate).replace('.0%', '%'));
            setText('cmd-hist-attempts', evidence.historical_sample_size !== undefined
                ? `Observed rate across ${evidence.historical_sample_size} attempts (${evidence.rate_source || 'configured'})`
                : null);
            setText('cmd-expected-recovery', evidence.expected_net_recovery_value !== undefined
                ? formatINR(evidence.expected_net_recovery_value)
                : null);
            if (evidence.expected_recovery_rate !== undefined) {
                const incentiveTotal = totals.recs.reduce((acc, r) => acc + (r.incentive_amount || 0), 0);
                setText('cmd-expected-note', `${formatINR(incentiveTotal)} incentive cost \u2022 ${formatPercent(evidence.expected_recovery_rate)} expected yield`);
            } else {
                setText('cmd-expected-note', null);
            }
            if (evidence.guardrail_decision) {
                setText('cmd-guardrail-note', evidence.guardrail_decision === 'allowed'
                    ? 'Guardrails passed: Execution permitted autonomously'
                    : `Guardrails: ${evidence.guardrail_decision.replace('_', ' ')} (${evidence.guardrail_reason_code || ''})`);
            }
        }

        function renderIncidentDetail() {
            const inc = AppState.activeIncident;
            if (!inc) return;

            setText('inc-bank-method', `${inc.bank || 'UNKNOWN'} · ${(inc.method || 'UNKNOWN').toUpperCase()}`);
            setText('inc-error-code', inc.error_code);
            setText('inc-error-step', inc.error_step);
            setText('inc-failure-jump', `${formatPercent(inc.current_failure_rate)} vs ${formatPercent(inc.baseline_failure_rate)}`);
            setText('inc-base-total', inc.baseline_total_count);
            setText('inc-base-failed', inc.baseline_failed_count);
            setText('inc-base-rate', formatPercent(inc.baseline_failure_rate));
            setText('inc-base-vol', formatINR(inc.baseline_failed_amount));
            setText('inc-curr-total', inc.current_total_count);
            setText('inc-curr-failed', inc.current_failed_count);
            setText('inc-curr-rate', formatPercent(inc.current_failure_rate));
            setText('inc-curr-vol', formatINR(inc.current_failed_amount));

            setText('inc-diag-heading', inc.diagnosis
                ? `Diagnosis Synthesis \u2022 ${titleCase(inc.diagnosis.diagnosis_type)}`
                : 'Diagnosis Synthesis');

            if (inc.diagnosis) {
                setText('inc-confidence-badge', `CONFIDENCE ${(inc.diagnosis.confidence * 100).toFixed(0)}%`);
                setText('inc-diag-explanation', inc.diagnosis.explanation);
            }

            const attempts = incidentRecoveries();
            setText('inc-attempts-count', `Records: ${attempts.length}`);
            const listEl = document.getElementById('inc-attempts-list');
            if (listEl) {
                if (attempts.length === 0) {
                    listEl.innerHTML = '<div class="text-text-muted text-center py-4 font-body">No associated recovery attempts yet.</div>';
                } else {
                    listEl.innerHTML = attempts.slice(0, 10).map(att => {
                        let statusDisplay = 'Awaiting Action';
                        if (att.status === 'recovered') statusDisplay = formatINR(att.recovered_amount);
                        else if (att.status === 'executed') statusDisplay = 'Link Dispatched';
                        else if (att.status === 'expired' || att.status === 'failed') statusDisplay = 'Not Recovered';
                        return `
                            <div class="p-2.5 rounded bg-surface-elevated border border-border-hairline flex justify-between items-center">
                                <div>
                                    <div class="text-white font-bold">${escapeHtml(att.recovery_id)}</div>
                                    <div class="text-[11px] text-text-muted">Action: ${escapeHtml(att.selected_action)} &bull; Amount: ${escapeHtml(formatINR(att.payment_amount))} &bull; Status: ${escapeHtml(att.status)}</div>
                                </div>
                                <span class="text-accent-cyan font-bold">${escapeHtml(statusDisplay)}</span>
                            </div>
                        `;
                    }).join('');
                }
            }
        }

        function renderDecisionRoom() {
            const rec = getActiveRecovery();
            const inc = AppState.activeIncident;
            const totals = campaignTotals();
            const evidence = (rec && rec.decision_evidence) || {};

            const outstanding = inc ? Math.max(0, inc.revenue_at_risk - totals.recoveredVolume) : null;
            setText('dec-revenue-at-risk-label', formatINR(outstanding));

            if (evidence.expected_net_recovery_value !== undefined) {
                const rate = evidence.expected_recovery_rate;
                setText('dec-expected-net', `${formatINR(evidence.expected_net_recovery_value)}${rate !== undefined ? ` (${formatPercent(rate)} expected yield)` : ''}`);
            } else {
                setText('dec-expected-net', null);
            }

            renderDecisionEvidence(rec, evidence);

            const btnAction = document.getElementById('btn-decision-action');
            const btnText = document.getElementById('btn-decision-action-text');
            const calloutEl = document.getElementById('dec-link-callout');

            if (!rec) {
                if (btnAction && btnText) {
                    btnText.textContent = 'No Recovery Plan';
                    btnAction.disabled = true;
                }
                if (calloutEl) calloutEl.classList.add('hidden');
                return;
            }

            setText('dec-recovery-id', rec.recovery_id);
            setText('dec-action-hero', (rec.selected_action || '').toUpperCase());

            const statusLabels = {
                pending: 'AWAITING APPROVAL',
                approved: 'APPROVED · READY',
                executing: 'EXECUTION INTERRUPTED · RETRY',
                executed: 'AWAITING CUSTOMER PAYMENT',
                recovered: `VERIFIED RECOVERED (${formatINR(rec.recovered_amount)})`,
                expired: 'EXPIRED · NOT RECOVERED',
                failed: 'FAILED · NOT RECOVERED',
            };
            setText('dec-attempt-status', statusLabels[rec.status] || (rec.status || '').toUpperCase());

            if (btnAction && btnText) {
                const base = 'px-5 py-2.5 font-heading font-bold text-[13px] rounded flex items-center gap-2 ';
                const isOpsReview = rec.selected_action === 'ops_review';
                if (rec.status === 'recovered') {
                    btnText.textContent = `Verified Recovered (${formatINR(rec.recovered_amount)})`;
                    btnAction.disabled = true;
                    btnAction.className = base + 'bg-accent-green/20 text-accent-green cursor-default border border-accent-green/40';
                } else if (rec.status === 'pending') {
                    btnText.textContent = isOpsReview ? 'Acknowledge Ops Review' : 'Approve Recovery';
                    btnAction.disabled = false;
                    btnAction.className = base + 'bg-accent-indigo text-white hover:bg-opacity-90 transition-all shadow-sm';
                } else if ((rec.status === 'approved' || rec.status === 'executing') && !isOpsReview) {
                    btnText.textContent = rec.status === 'executing' ? 'Resume Execution' : 'Execute Recovery';
                    btnAction.disabled = false;
                    btnAction.className = base + 'bg-accent-green text-black hover:bg-opacity-90 transition-all shadow-sm';
                } else if (rec.status === 'executed') {
                    btnText.textContent = 'Link Dispatched · Awaiting Payment';
                    btnAction.disabled = true;
                    btnAction.className = base + 'bg-surface-elevated text-accent-cyan cursor-default border border-accent-cyan/30';
                } else {
                    btnText.textContent = isOpsReview ? 'Ops Review · Handled Manually' : `Status: ${(rec.status || '').toUpperCase()}`;
                    btnAction.disabled = true;
                    btnAction.className = base + 'bg-surface-elevated text-text-muted cursor-default border border-border-hairline';
                }
            }

            const shortUrlLink = document.getElementById('dec-short-url-link');
            const payNowBtn = document.getElementById('dec-pay-now-btn');
            const targetUrl = safePaymentUrl(rec.short_url);
            if (calloutEl) {
                if (targetUrl && rec.status === 'executed') {
                    calloutEl.classList.remove('hidden');
                    if (shortUrlLink) {
                        shortUrlLink.textContent = rec.short_url;
                        shortUrlLink.href = targetUrl;
                    }
                    if (payNowBtn) payNowBtn.href = targetUrl;
                } else {
                    calloutEl.classList.add('hidden');
                }
            }
        }

        function renderDecisionEvidence(rec, evidence) {
            const hasHistory = evidence.historical_sample_size !== undefined;
            setText('dec-hist-attempts', hasHistory ? `${evidence.historical_sample_size} historical attempts` : null);
            setText('dec-hist-rate', evidence.expected_recovery_rate !== undefined
                ? formatPercent(evidence.expected_recovery_rate) : null);
            setText('dec-hist-calibration', evidence.rate_source
                ? (evidence.rate_source === 'configured'
                    ? 'Configured default (no history yet)'
                    : `Observed history (${evidence.rate_source.replace(/_/g, ' ')})`)
                : null);
            setText('dec-incentive-cost', rec ? formatINR(rec.incentive_amount) + ' per attempt' : null);

            const fallbackRationale = evidence.diagnosis_explanation || null;
            setText('dec-rationale', evidence.concise_decision_reason || fallbackRationale);

            const grid = document.getElementById('dec-guardrail-grid');
            if (!grid) return;
            const checks = Array.isArray(evidence.guardrail_checks) ? evidence.guardrail_checks : [];
            if (checks.length === 0) {
                grid.innerHTML = '<div class="text-text-muted font-body col-span-full">No guardrail evaluation recorded for this attempt.</div>';
                return;
            }
            grid.innerHTML = checks.map((c, idx) => {
                const ok = !!c.passed;
                const icon = ok ? 'check' : 'block';
                const color = ok ? 'text-accent-green' : 'text-accent-coral';
                const label = String(c.check_name || '').replace(/_/g, ' ');
                return `
                    <div class="p-3.5 rounded bg-surface-elevated border border-border-hairline space-y-1">
                        <span class="text-[10px] text-text-subtle uppercase block font-mono">${idx + 1}. ${escapeHtml(label)}</span>
                        <span class="${color} font-bold block flex items-center gap-1">
                            <span class="material-symbols-outlined text-[14px]">${icon}</span> ${escapeHtml(c.reason_code || (ok ? 'PASSED' : 'FAILED'))}
                        </span>
                        <span class="text-[11px] text-text-muted">${escapeHtml(c.explanation || '')}</span>
                    </div>
                `;
            }).join('');
        }

        function renderCampaign() {
            const totals = campaignTotals();
            const recoveries = totals.recs;
            const activeId = AppState.activeRecoveryId;

            setText('camp-target-count', AppState.activeIncident ? totals.targetCount : null);
            setText('camp-table-count', AppState.activeIncident ? totals.targetCount : null);
            setText('camp-target-volume', AppState.activeIncident ? formatINR(totals.targetVolume) : null);
            setText('camp-recovered-volume', AppState.activeIncident ? formatINR(totals.recoveredVolume) : null);

            const terminal = ['recovered', 'expired', 'failed'];
            const allSettled = recoveries.length > 0 && recoveries.every(r => terminal.includes(r.status));
            const anyRecovered = recoveries.some(r => r.status === 'recovered');
            const anyExecuted = recoveries.some(r => r.status === 'executed' || r.status === 'recovered');
            const anyPending = recoveries.some(r => r.status === 'pending');

            const steps = [1, 2, 3, 4, 5, 6].map(n => document.getElementById('camp-step-' + n));
            const done = 'p-2.5 rounded bg-surface-elevated border border-accent-green/40 text-accent-green font-bold';
            const current = 'p-2.5 rounded bg-surface-elevated border border-accent-cyan/40 text-accent-cyan font-bold';
            const idle = 'p-2.5 rounded bg-surface-elevated border border-border-hairline text-text-muted';
            // Steps: 1 detect, 2 decide, 3 dispatch, 4 customer pays, 5 webhook verified, 6 recovered
            let reached = 2;
            if (anyExecuted) reached = 4;
            if (anyRecovered) reached = 5;
            if (allSettled && anyRecovered) reached = 7;
            steps.forEach((el, idx) => {
                if (!el) return;
                const stepNo = idx + 1;
                el.className = stepNo < reached ? done : (stepNo === reached ? current : idle);
            });

            const badgeEl = document.getElementById('camp-status-badge');
            if (badgeEl) {
                const badge = (text, color) => {
                    badgeEl.textContent = text;
                    badgeEl.className = `px-2 py-0.5 rounded bg-accent-${color}/20 text-accent-${color} font-bold border border-accent-${color}/30 text-[11px] inline-block mt-1`;
                };
                if (recoveries.length === 0) badge(PLACEHOLDER, 'indigo');
                else if (allSettled) badge(anyRecovered ? 'COMPLETED' : 'CLOSED · NOT RECOVERED', anyRecovered ? 'green' : 'coral');
                else if (anyRecovered) badge(`RECOVERING (${totals.recoveredCount}/${totals.targetCount})`, 'green');
                else if (anyExecuted) badge('DISPATCHED', 'cyan');
                else if (anyPending) badge('NEEDS APPROVAL', 'amber');
                else badge('READY', 'indigo');
            }

            // Payment link banner: the selected attempt if it has a link, else the first open link.
            const selected = recoveries.find(r => r.recovery_id === activeId && r.status === 'executed' && r.short_url);
            const linkAttempt = selected || recoveries.find(r => r.status === 'executed' && r.short_url);
            const bannerEl = document.getElementById('demo-pay-banner');
            if (bannerEl) {
                const targetUrl = linkAttempt ? safePaymentUrl(linkAttempt.short_url) : null;
                if (targetUrl) {
                    bannerEl.classList.remove('hidden');
                    const linkBtn = document.getElementById('demo-pay-link-btn');
                    if (linkBtn) linkBtn.href = targetUrl;
                    setText('demo-pay-link-id', linkAttempt.payment_link_id);
                    setText('demo-pay-short-url', linkAttempt.short_url);
                } else {
                    bannerEl.classList.add('hidden');
                }
            }

            const tbody = document.getElementById('attempts-table-body');
            if (!tbody) return;
            if (recoveries.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="py-8 text-center text-text-muted font-body">No recovery records found for active incident.</td></tr>';
                return;
            }

            const statusColors = {
                recovered: 'bg-accent-green/10 text-accent-green border-accent-green/30',
                executed: 'bg-accent-cyan/10 text-accent-cyan border-accent-cyan/30',
                approved: 'bg-accent-indigo/10 text-accent-indigo border-accent-indigo/30',
                pending: 'bg-accent-amber/10 text-accent-amber border-accent-amber/30',
            };

            tbody.innerHTML = recoveries.map(r => {
                const isSelected = r.recovery_id === activeId;
                const statusColor = statusColors[r.status] || 'bg-surface-elevated text-text-muted border-border-hairline';
                const targetUrl = r.status === 'executed' ? safePaymentUrl(r.short_url) : null;
                const payCell = targetUrl
                    ? `<a href="${escapeHtml(targetUrl)}" target="_blank" rel="noopener" class="px-2.5 py-1 rounded bg-accent-cyan text-black hover:bg-opacity-90 font-bold text-[11px] inline-flex items-center gap-1">Pay Test Mode &rarr;</a>`
                    : PLACEHOLDER;
                return `
                    <tr class="hover:bg-surface-card transition-colors cursor-pointer ${isSelected ? 'bg-accent-indigo/5' : ''}" data-recovery-id="${escapeHtml(r.recovery_id)}">
                        <td class="py-3.5 px-4 text-white font-bold">
                            ${escapeHtml(r.recovery_id)}
                            ${isSelected ? '<span class="ml-2 px-1.5 py-0.5 rounded text-[10px] bg-accent-indigo/20 text-accent-cyan border border-accent-cyan/30 font-mono">Selected</span>' : ''}
                        </td>
                        <td class="py-3.5 px-4 text-accent-indigo font-medium uppercase">${escapeHtml(r.selected_action)}</td>
                        <td class="py-3.5 px-4 text-text-muted">${escapeHtml(formatINR(r.incentive_amount))}</td>
                        <td class="py-3.5 px-4">
                            <span class="px-2 py-0.5 rounded text-[11px] font-bold border ${statusColor}">${escapeHtml(r.status)}</span>
                        </td>
                        <td class="py-3.5 px-4 text-white font-bold">${escapeHtml(formatINR(r.recovered_amount))}</td>
                        <td class="py-3.5 px-4 text-accent-cyan font-mono">${escapeHtml(r.payment_link_id || PLACEHOLDER)}</td>
                        <td class="py-3.5 px-4 text-right font-mono">${payCell}</td>
                    </tr>
                `;
            }).join('');

            // Row click selects the attempt (no inline handlers built from API data).
            tbody.querySelectorAll('tr[data-recovery-id]').forEach(row => {
                row.addEventListener('click', (ev) => {
                    if (ev.target.closest('a')) return;
                    selectRecovery(row.getAttribute('data-recovery-id'));
                });
            });
        }

        function renderAuditTrail() {
            const events = AppState.auditEvents || [];
            setText('audit-events-count', `Events: ${events.length}`);

            const listEl = document.getElementById('audit-events-list');
            if (!listEl) return;
            if (events.length === 0) {
                listEl.innerHTML = '<div class="text-text-muted text-center py-6 font-body">No audit log records found for the selected recovery attempt.</div>';
                return;
            }
            listEl.innerHTML = events.map(ev => `
                <div class="p-4 rounded-lg bg-surface-elevated border border-border-hairline space-y-2">
                    <div class="flex justify-between items-center border-b border-border-hairline pb-2">
                        <span class="font-bold text-accent-cyan">${escapeHtml(ev.event_type)}</span>
                        <span class="text-text-subtle text-[11px]">${escapeHtml(new Date(ev.created_at).toLocaleString())}</span>
                    </div>
                    <div class="text-white text-[13px] font-body">${escapeHtml(ev.explanation || 'State transition recorded')}</div>
                    <div class="flex flex-wrap gap-4 text-[11px] text-text-muted pt-1">
                        <span>Actor: <span class="text-white font-mono">${escapeHtml(ev.actor_type)}${ev.actor_id ? ' / ' + escapeHtml(ev.actor_id) : ''}</span></span>
                        <span>Transition: <span class="text-text-subtle font-mono">${escapeHtml(ev.previous_state || 'none')}</span> &rarr; <span class="text-accent-green font-mono">${escapeHtml(ev.new_state || 'none')}</span></span>
                        ${ev.reason_code ? `<span>Reason: <span class="text-white font-mono">${escapeHtml(ev.reason_code)}</span></span>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function describeError(err) {
            const detail = err && err.data && err.data.detail;
            if (detail && typeof detail === 'object') {
                return detail.explanation || detail.message || JSON.stringify(detail);
            }
            return (err && err.message) || 'Unknown error';
        }

        // --- Controller Actions ---

        async function handleDecisionPrimaryAction() {
            const rec = getActiveRecovery();
            if (!rec) {
                alert('No recovery plan selected.');
                return;
            }

            const btnAction = document.getElementById('btn-decision-action');
            const btnText = document.getElementById('btn-decision-action-text');
            const busy = (label) => {
                if (btnText) btnText.innerHTML = `<span class="material-symbols-outlined animate-spin text-[16px]">progress_activity</span> ${escapeHtml(label)}`;
                if (btnAction) btnAction.disabled = true;
            };

            try {
                if (rec.status === 'pending') {
                    const what = rec.selected_action === 'ops_review'
                        ? `Acknowledge ops review ${rec.recovery_id}?`
                        : `Approve ${rec.selected_action} recovery ${rec.recovery_id} for ${formatINR(rec.charge_amount)}?`;
                    if (!confirm(what)) return;
                    busy('Approving...');
                    await RecoverAPI.approveRecovery(rec.recovery_id);
                } else if ((rec.status === 'approved' || rec.status === 'executing') && rec.selected_action !== 'ops_review') {
                    if (!confirm(`Send a payment link for ${formatINR(rec.charge_amount)} to the customer for ${rec.recovery_id}?`)) return;
                    busy('Executing...');
                    await RecoverAPI.executeRecovery(rec.recovery_id);
                }
            } catch (err) {
                alert(`Operation failed: ${describeError(err)}`);
            } finally {
                // Keep the same attempt selected so its link and audit trail stay visible.
                AppState.activeRecoveryId = rec.recovery_id;
                await refreshRecoveries();
            }
        }

        async function executeActiveRecovery() {
            const inc = AppState.activeIncident;
            if (!inc) {
                alert('No active incident.');
                return;
            }
            if (!AppState.recoveries.length) await refreshRecoveries();

            // Only this incident's campaign, and only link-executable actions.
            const scoped = incidentRecoveries().filter(r => r.selected_action !== 'ops_review');
            const toApprove = scoped.filter(r => r.status === 'pending');
            const toExecute = scoped.filter(r => r.status === 'pending' || r.status === 'approved' || r.status === 'executing');

            if (toExecute.length === 0) {
                alert('Nothing to dispatch: every attempt in this campaign is already dispatched or settled.');
                return;
            }

            const total = toExecute.reduce((acc, r) => acc + (r.charge_amount || 0), 0);
            let message = `Dispatch ${toExecute.length} payment link(s) totalling ${formatINR(total)} for incident ${String(inc.id).substring(0, 8)}?`;
            if (toApprove.length) {
                message += `\n\nThis also approves ${toApprove.length} attempt(s) that are awaiting operator approval.`;
            }
            if (!confirm(message)) return;

            const btn = document.getElementById('btn-execute-campaign');
            const btnText = document.getElementById('btn-execute-campaign-text');
            if (btnText) btnText.innerHTML = '<span class="material-symbols-outlined animate-spin text-[16px]">progress_activity</span> Dispatching...';
            if (btn) btn.disabled = true;

            const failures = [];
            let dispatched = 0;
            for (const att of toExecute) {
                try {
                    if (att.status === 'pending') {
                        await RecoverAPI.approveRecovery(att.recovery_id);
                    }
                    await RecoverAPI.executeRecovery(att.recovery_id);
                    dispatched += 1;
                } catch (err) {
                    // Keep going: one gateway/guardrail failure must not strand the rest.
                    failures.push(`${att.recovery_id}: ${describeError(err)}`);
                }
            }

            await refreshRecoveries();
            if (btnText) btnText.textContent = 'Dispatch Payment Links';
            if (btn) btn.disabled = false;

            if (failures.length) {
                alert(`Dispatched ${dispatched} of ${toExecute.length} link(s).\n\nFailed:\n${failures.join('\n')}`);
            }
        }

        async function refreshRecoveries() {
            try {
                AppState.recoveries = await RecoverAPI.getRecoveries();
                if (AppState.activeIncident) {
                    // Keep incident status/outcomes current as attempts settle.
                    AppState.activeIncident = await RecoverAPI.getIncidentDetail(AppState.activeIncident.id);
                }
                renderAll();
            } catch (e) {
                console.warn('Could not refresh recoveries:', e);
            }
        }

        async function refreshAuditTrail() {
            const rec = getActiveRecovery();
            if (!rec) {
                AppState.auditEvents = [];
                renderAuditTrail();
                return;
            }
            try {
                AppState.auditEvents = await RecoverAPI.getRecoveryAudit(rec.recovery_id);
                renderAuditTrail();
            } catch (e) {
                console.warn('Could not load audit events:', e);
            }
        }

        function setConnectionStatus(ok, text) {
            const statusText = document.getElementById('header-status-text');
            if (!statusText) return;
            statusText.textContent = text;
            if (!ok && statusText.parentElement) {
                statusText.parentElement.className = 'flex items-center gap-2 px-3 py-1.5 rounded bg-surface-card border border-accent-coral/30 text-[12px] font-mono text-accent-coral';
            }
        }

        // --- Initialization ---

        async function initApp() {
            clearLiveFields();
            setConnectionStatus(true, 'FETCHING TELEMETRY...');

            // Independent requests: one failure must not hide the others.
            const [summaryRes, incidentsRes, recoveriesRes] = await Promise.allSettled([
                RecoverAPI.getDashboardSummary(),
                RecoverAPI.getIncidents(),
                RecoverAPI.getRecoveries(),
            ]);

            if (summaryRes.status === 'fulfilled') AppState.summary = summaryRes.value;
            if (recoveriesRes.status === 'fulfilled') AppState.recoveries = recoveriesRes.value;
            if (incidentsRes.status === 'fulfilled') {
                AppState.incidents = incidentsRes.value;
                const active = AppState.incidents.filter(i => i.status !== 'resolved');
                const pool = active.length ? active : AppState.incidents;
                // Most recent unresolved incident first.
                pool.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                if (pool.length) {
                    try {
                        AppState.activeIncident = await RecoverAPI.getIncidentDetail(pool[0].id);
                    } catch (e) {
                        console.warn('Could not load incident detail:', e);
                    }
                }
            }

            const failed = [summaryRes, incidentsRes, recoveriesRes].filter(r => r.status === 'rejected');
            AppState.apiAvailable = failed.length < 3;
            setText('header-merchant-name', String(RecoverAPI.getMerchantId()).substring(0, 8));

            renderAll();

            if (failed.length === 0) {
                setConnectionStatus(true, 'LIVE CONTROL PLANE');
            } else if (failed.length === 3) {
                console.error('API unavailable:', failed.map(f => f.reason));
                setConnectionStatus(false, 'API DISCONNECTED');
            } else {
                setConnectionStatus(false, 'PARTIAL DATA');
            }
        }

        // Customers pay in another tab; pick up verified settlements on return.
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && AppState.apiAvailable) {
                refreshRecoveries();
            }
        });

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
